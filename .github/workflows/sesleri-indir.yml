# .sesler/liste.txt'teki ("ad url" satırları) ses dosyalarını HAM olarak indirip .sesler/ham/ altına kaydeder.
# (Claude'un çalışma ortamı bu sitelere erişemediği için indirme GitHub Actions'ta yapılır;
#  ses düzeyi ayarı ve sıkıştırma sonra yerelde ffmpeg ile yapılır.) Hangi dala gönderildiyse oraya kaydeder.
name: Sesleri indir

on:
  push:
    paths:
      - ".sesler/liste.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  indir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ses dosyalarini indir
        run: |
          set -e
          mkdir -p .sesler/ham
          while read -r ad url; do
            [ -z "$ad" ] && continue
            curl -fsSL -o ".sesler/ham/$ad.mp3" "$url"
            echo "$ad indirildi ($(stat -c %s ".sesler/ham/$ad.mp3") bayt)"
          done < .sesler/liste.txt

      - name: Depoya kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git rm -q .sesler/liste.txt
          git add .sesler/ham
          git commit -m "Ham ses dosyalari indirildi"
          git push
